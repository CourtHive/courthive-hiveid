name: release-please

# release-please maintains a perpetual release PR on main that
# accumulates conventional commits since the last release. Merging
# the PR creates a GitHub release + a `v{version}` tag and bumps
# package.json + CHANGELOG.md.
#
# Auth: mints a `courthive-release-bot` App token rather than using the built-in
# `secrets.GITHUB_TOKEN`. GitHub deliberately does not trigger workflows from
# events raised by GITHUB_TOKEN (the recursion guard), so a release PR opened
# with it never gets a CI run at all — releases here were merged untested.
#
# Aligned 2026-08-15 with courthive-query, courthive-facilities,
# courthive-rankings and competition-factory-server.
#
# Required repo secrets (mint via the shared `courthive-release-bot` App):
#   RELEASE_BOT_CLIENT_ID    — App Client ID (string, e.g. "Iv23li...")
#   RELEASE_BOT_PRIVATE_KEY  — PEM contents (BEGIN/END markers included)
#
# Day-to-day flow:
#   1. Land feature/fix PRs on main with conventional commits
#      (feat:, fix:, chore:, docs:, etc.)
#   2. The bot updates a `chore: release X.Y.Z` PR automatically
#   3. Merge the release PR → GitHub release + tag are created
#      and package.json is bumped.
#
# To force a specific version, edit `.release-please-manifest.json`
# on main directly.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
